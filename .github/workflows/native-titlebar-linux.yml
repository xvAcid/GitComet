name: Native titlebar Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_INCREMENTAL: "0"
    steps:
      # github.sha is the commit of the branch selected in Run workflow.
      # Do not replace it with an upstream release tag: that loses our patch.
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config python3 \
            libfontconfig1-dev libfreetype6-dev libssl-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-titlebar-ubuntu24-x86_64-rust1.98.1-lto0-cg16-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-titlebar-ubuntu24-x86_64-rust1.98.1-lto0-cg16-v1-${{ hashFiles('Cargo.lock') }}-

      - name: Test installer and packaging
        run: python3 -m unittest discover -s scripts/native-titlebar -p 'test_*.py'

      - name: Build patched GUI
        run: >-
          cargo +1.98.1 build --locked --release
          --target x86_64-unknown-linux-gnu
          -p gitcomet --bin gitcomet
          --no-default-features --features ui-gpui,gix

      - name: Verify binary version
        run: target/x86_64-unknown-linux-gnu/release/gitcomet --version

      - name: Package binary and reversible installer
        run: python3 scripts/native-titlebar/package.py

      - name: Upload installable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitcomet-native-titlebar-linux-x86_64-${{ github.sha }}
          path: |
            dist/gitcomet-*-native-titlebar-linux-x86_64.tar.gz
            dist/gitcomet-*-native-titlebar-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
